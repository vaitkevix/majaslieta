const API = 'https://vaitkevix.cloud/sh/api/ml', PINK = 'shd_pin';

function joinName(A) {
  const sp = A.map(a => { const m = String(a).match(/^(.*?)\s+(\d.*)$/); return m ? [m[1], m[2]] : [a, '']; });
  const st = [...new Set(sp.map(x => x[0]))];
  return st.length === 1 && sp.every(x => x[1]) ? st[0] + ' ' + sp.map(x => x[1]).join(', ') : A.join(' / ');
}

  if (on) return st === 'added' ? 'Atzīmēts · pievienots Pazemes stāvvietām (' + sv.stav + ' m²)' : st === 'in' ? 'Atzīmēts · jau ir Pazemes stāvvietās' : st === 'off' ? 'Atzīmēts · Pazemes stāvvietas šim objektam izslēgtas cilnē Objekts' : 'Atzīmēts kā autostāvvieta (virszemes — Pazemes stāvvietās nepievieno)';
  return st === 'in' ? 'Noņemts · Pazemes stāvvietās nemainīts — izslēdziet pakalpojumu cilnē Objekts' : 'Noņemts';
}
function grupasTbl(G) {
  if (!G.length) return '';
  return `<div class="bld"><h3>Citas telpu grupas</h3><div class="tw"><table class="tb"><thead><tr><th>Telpu grupa</th><th class="r">Platība, m²</th></tr></thead><tbody>${
    G.map(g => `<tr><td><b style="display:block">${esc(g.nosaukums || 'Telpu grupa')}</b><small style="color:var(--ink3);font-weight:700">${esc([g.apz, g.lv].filter(Boolean).join(' · '))}</small>${(g.telpas_n || []).length ? `<small style="display:block;color:var(--ink3)">${esc(g.telpas_n.slice(0, 6).join(', '))}</small>` : ''}${parkBtn(g, false)}</td><td class="r">${g.m2 ? nf(g.m2) : '—'}</td></tr>`).join('')}</tbody></table></div></div>`;
}
function kadHash() {
  const m = location.hash.match(/^#kadastrs=([A-Za-z0-9_-]+)/); if (!m) return;
  history.replaceState(null, '', location.pathname + location.search);
  let raw; try { raw = JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g, '+').replace(/_/g, '/'))))); } catch (e) { return toast('Neizdevās nolasīt kadastra datus', 'err'); }
  const L = (Array.isArray(raw) ? raw : [raw]).filter(Boolean); if (!L.length) return;
  const go = async () => { if (!can('vaditajs')) return toast('Jums ir tikai skatīšanās tiesības', 'err');
    S.imp = { url: 'https://www.kadastrs.lv', title: '', anorm: '' };
    try {
      if (L.length > 1) {   // vairākas mājas uz viena zemes gabala → katra savā objektā
        const items = []; for (const x of L) { const dati = kadFromBtn([x]); items.push(Object.assign({ name: x.adrese || x.buve || 'Būve' }, await call('kadParse', { dati }))); }
        S.impAll = kadFromBtn(L); return impMulti(items);
      }
      const dati = kadFromBtn(L); S.imp.title = dati.adrese; impPreview(await call('kadParse', { dati }));
    } catch (e) { toast(e.message, 'err'); } };
  if (S.D) go(); else { const t = setInterval(() => { if (S.D) { clearInterval(t); go(); } }, 300); }
}
addEventListener('hashchange', kadHash);

/* ---------- start ---------- */
kadHash();
const IMP = /^#imp\b/.test(location.hash);
if (IMP) { history.replaceState(null, '', location.pathname + location.search); waitKad(); }
if (S.pin) load().catch(e => showGate(e.code === 'auth' ? e.message : e.message)); else showGate('');
</script>
